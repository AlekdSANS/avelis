services:
  - type: web
    name: avelis-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: IMAGE_STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SERVICE_VERSION
        value: render
      - key: OBSERVABILITY_WEBHOOK_URL
        sync: false
      - key: OBSERVABILITY_TOKEN
        sync: false

  - type: web
    name: avelis-storefront
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_IS_DEMO_STORE
        value: true
      - key: VITE_LEGAL_OPERATOR_NAME
        sync: false
      - key: VITE_LEGAL_POSTAL_ADDRESS
        sync: false
      - key: VITE_LEGAL_EMAIL
        sync: false
      - key: VITE_SUPPORT_EMAIL
        sync: false
      - key: VITE_ANALYTICS_ENABLED
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
