name: AVELIS uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AVELIS_API_URL: ${{ vars.AVELIS_API_URL }}
    steps:
      - name: Validate monitor configuration
        run: test -n "$AVELIS_API_URL"
      - name: Check API readiness
        run: curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 "$AVELIS_API_URL/api/health/ready"
